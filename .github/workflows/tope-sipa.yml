name: Tope SIPA del mes (automático)

# El tope de aportes lo mueve ANSES todos los meses por la movilidad del DNU
# 274/2024 (IPC de dos meses atrás). El cálculo es determinístico y reproduce
# al centavo las resoluciones oficiales (ver scripts/tope_sipa.py), así que
# acá SÍ se publica solo: commit directo a main, sin PR. Las tablas de ARCA
# (escala y deducciones de Ganancias) van en el otro workflow, porque salen de
# leer PDFs: se publican solas solo cuando todo sube parejo.
# Desde el 26/10/2026 también lleva el tope anual del seguro de vida de
# Ganancias (IPC de octubre a octubre, el 1 de enero de cada año).
#
# Corre todos los días a las 09:00 de Argentina. Los días que el tope del mes
# ya está publicado no hace nada. El 1 de cada mes aparece el tope nuevo.
#
# Avisa con un issue (17/11/2026) si el robot falla y si el día 5 el tope del
# mes todavía no salió: el de noviembre de 2026 llegó recién el 14/11, con el
# robot en verde todos los días, porque a la API le faltaba el IPC. El aviso
# del atraso se cierra solo cuando el tope sale.

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: tope-sipa
  cancel-in-progress: false

jobs:
  tope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Calcular el tope del mes con el IPC del INDEC
        # El error queda en un archivo para que el issue de abajo lo cuente.
        run: |
          set +e
          python scripts/tope_sipa.py 2> error-robot.txt
          estado=$?
          cat error-robot.txt >&2
          exit $estado

      - name: Publicar si cambió
        run: |
          if git diff --quiet -- parametros.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "robot-tope-sipa"
          git config user.email "robot@sueldo-en-mano"
          VERSION=$(python -c "import json; print(json.load(open('parametros.json'))['version'])")
          MES=$(python -c "import json; print(json.load(open('parametros.json'))['aportes']['vigenciaDesde'][:7])")
          TOPE=$(python -c "import json; print(json.load(open('parametros.json'))['aportes']['baseImponibleTope'])")
          git add parametros.json
          git commit -m "Pizarra v${VERSION}: tope SIPA de ${MES} = ${TOPE} (robot, IPC INDEC)"
          git push

      - name: Avisar si el tope del mes está atrasado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f atraso-tope-sipa.txt ]; then
            exit 0
          fi
          MES=$(head -n 1 atraso-tope-sipa.txt)
          TITULO="El tope del SIPA de $MES todavía no salió"
          if [ -n "$(gh issue list --state open --search "in:title \"$TITULO\"" --json number --jq '.[].number')" ]; then
            echo "Ya hay un issue abierto."
            exit 0
          fi
          {
            tail -n +2 atraso-tope-sipa.txt
            echo
            echo "A quien gana más que el tope, la app le calcula los aportes con el tope del mes anterior, que es más bajo: le descuenta un poco menos y el neto le da un poco de más."
            echo
            echo "No hace falta hacer nada: cuando aparezca el IPC, el robot publica el tope solo y este issue se cierra solo."
            echo "Si no querés esperar y ANSES ya publicó la resolución del mes, cargalo a mano: Actions › «Actualizar parámetros fiscales» › Run workflow, con el tope y el mes (abre un PR para revisar)."
          } > cuerpo.md
          gh issue create --title "$TITULO" --body-file cuerpo.md

      - name: Cerrar el aviso del atraso cuando el tope sale
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f atraso-tope-sipa.txt ]; then
            exit 0
          fi
          TOPE=$(python -c "import json; a=json.load(open('parametros.json'))['aportes']; print(a['vigenciaDesde'][:7], a['baseImponibleTope'])")
          for N in $(gh issue list --state open --search 'in:title "El tope del SIPA de" "todavía no salió"' --json number --jq '.[].number'); do
            gh issue close "$N" --comment "Ya salió: el tope vigente es el de ${TOPE% *} = ${TOPE#* } (lo publicó el robot)."
          done

      - name: Avisar si el robot falló
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITULO="El robot del tope del SIPA falló"
          if [ -n "$(gh issue list --state open --search "in:title \"$TITULO\"" --json number --jq '.[].number')" ]; then
            echo "Ya hay un issue abierto: no se repite cada día."
            exit 0
          fi
          {
            echo "El robot del tope del SIPA terminó con error y no publicó nada (la pizarra quedó como estaba)."
            echo
            echo "Corrida: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            if [ -s error-robot.txt ]; then
              echo '```'
              tail -n 20 error-robot.txt
              echo '```'
            fi
            echo
            echo "Mientras siga así, la app no toma el tope de los meses nuevos (ni el del seguro de vida en enero). Cerrá este issue cuando quede arreglado: si vuelve a fallar, se abre otro."
          } > cuerpo.md
          gh issue create --title "$TITULO" --body-file cuerpo.md
