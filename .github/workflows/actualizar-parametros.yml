name: Actualizar parámetros fiscales

# Avisa con un issue si el robot falla (17/11/2026): hasta entonces, si ARCA
# cambiaba el nombre de un PDF, el robot fallaba todos los lunes sin que nadie
# se enterara. En enero y en julio, las dos primeras semanas sin los PDF del
# semestre nuevo no son una falla: el robot espera (ver el script).

on:
  schedule:
    # Todos los lunes, 13:00 UTC (10:00 Argentina, una hora después del tope
    # del SIPA). Las semanas sin novedades no hace nada. Cuando ARCA publica
    # tablas nuevas y TODOS los montos suben por el mismo factor (una
    # actualización por IPC limpia), las publica solo; si no, abre un PR para
    # revisión humana (ver scripts/actualizar_parametros.py).
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      tope_sipa:
        description: "Tope SIPA mensual nuevo (ej: 4594798.23). Vacío = no tocar."
        required: false
        default: ""
      mes_tope:
        description: "Desde qué mes rige ese tope, AAAA-MM (ej: 2026-08). Vacío = el mes de hoy."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pdfplumber requests

      - name: Bajar PDFs de ARCA y regenerar parametros.json
        id: robot
        # Lo que se escribe a mano entra por variables, no pegado en el comando.
        # El error queda en un archivo FUERA del repo para que el issue de abajo lo
        # cuente (adentro, el paso del PR lo tomaba como un cambio).
        env:
          TOPE_SIPA: ${{ github.event.inputs.tope_sipa }}
          MES_TOPE: ${{ github.event.inputs.mes_tope }}
        run: |
          set +e
          python scripts/actualizar_parametros.py "$TOPE_SIPA" "$MES_TOPE" 2> "$RUNNER_TEMP/error-robot.txt"
          estado=$?
          cat "$RUNNER_TEMP/error-robot.txt" >&2
          exit $estado

      - name: Publicar solo si es una actualización por IPC pareja
        if: steps.robot.outputs.directo == 'true'
        run: |
          git config user.name "robot-ganancias"
          git config user.email "robot@sueldo-en-mano"
          VERSION=$(python -c "import json; print(json.load(open('parametros.json'))['version'])")
          git add parametros.json
          git commit -m "Pizarra v${VERSION}: tablas de Ganancias de ARCA, actualización por IPC pareja (robot)"
          git pull --rebase
          git push

      - name: Abrir Pull Request si hay cambios que revisar
        if: steps.robot.outputs.directo != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Parámetros fiscales nuevos (ARCA/ANSES)"
          title: "📊 Parámetros fiscales nuevos — revisar y aprobar"
          body: |
            El robot encontró valores nuevos en los PDFs oficiales de ARCA
            (y/o un tope SIPA cargado a mano). Ya pasaron la validación
            matemática (alícuotas, montos fijos que cierran, relación 4,8×,
            mínimo no imponible contra el primer tramo), pero NO subieron
            todos por el mismo factor: por eso no se publicaron solos.

            **Revisá el diff contra los PDF oficiales y aprobá con Merge.**
            Al mergear, la pizarra se publica sola y las apps toman los
            valores nuevos al abrir con internet.
          branch: robot/parametros-fiscales
          delete-branch: true
          # Solo la pizarra: cualquier otro archivo que quede en la carpeta no va.
          add-paths: parametros.json

      - name: Avisar si el robot falló
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITULO="El robot de las tablas de ARCA falló"
          if [ -n "$(gh issue list --state open --search "in:title \"$TITULO\"" --json number --jq '.[].number')" ]; then
            echo "Ya hay un issue abierto: no se repite cada lunes."
            exit 0
          fi
          {
            echo "El robot de las tablas de Ganancias de ARCA terminó con error y no publicó nada (la pizarra quedó como estaba)."
            echo
            echo "Corrida: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            if [ -s "$RUNNER_TEMP/error-robot.txt" ]; then
              echo '```'
              tail -n 20 "$RUNNER_TEMP/error-robot.txt"
              echo '```'
            fi
            echo
            echo "Mientras siga así, la app no toma las tablas nuevas de Ganancias (la escala y las deducciones del semestre). Cerrá este issue cuando quede arreglado: si vuelve a fallar, se abre otro."
          } > cuerpo.md
          gh issue create --title "$TITULO" --body-file cuerpo.md
