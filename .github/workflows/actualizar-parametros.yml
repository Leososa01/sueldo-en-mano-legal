name: Actualizar parámetros fiscales

on:
  schedule:
    # Todos los lunes, 13:00 UTC (10:00 Argentina, una hora después del tope
    # del SIPA). Las semanas sin novedades no hace nada. Cuando ARCA publica
    # tablas nuevas y TODOS los montos suben por el mismo factor (una
    # actualización por IPC limpia), las publica solo; si no, abre un PR para
    # revisión humana (ver scripts/actualizar_parametros.py).
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      tope_sipa:
        description: "Tope SIPA mensual nuevo (ej: 4594798.23). Vacío = no tocar."
        required: false
        default: ""
      mes_tope:
        description: "Desde qué mes rige ese tope, AAAA-MM (ej: 2026-08). Vacío = el mes de hoy."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pdfplumber requests

      - name: Bajar PDFs de ARCA y regenerar parametros.json
        id: robot
        run: >-
          python scripts/actualizar_parametros.py
          "${{ github.event.inputs.tope_sipa }}"
          "${{ github.event.inputs.mes_tope }}"

      - name: Publicar solo si es una actualización por IPC pareja
        if: steps.robot.outputs.directo == 'true'
        run: |
          git config user.name "robot-ganancias"
          git config user.email "robot@sueldo-en-mano"
          VERSION=$(python -c "import json; print(json.load(open('parametros.json'))['version'])")
          git add parametros.json
          git commit -m "Pizarra v${VERSION}: tablas de Ganancias de ARCA, actualización por IPC pareja (robot)"
          git pull --rebase
          git push

      - name: Abrir Pull Request si hay cambios que revisar
        if: steps.robot.outputs.directo != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Parámetros fiscales nuevos (ARCA/ANSES)"
          title: "📊 Parámetros fiscales nuevos — revisar y aprobar"
          body: |
            El robot encontró valores nuevos en los PDFs oficiales de ARCA
            (y/o un tope SIPA cargado a mano). Ya pasaron la validación
            matemática (alícuotas, montos fijos que cierran, relación 4,8×,
            mínimo no imponible contra el primer tramo), pero NO subieron
            todos por el mismo factor: por eso no se publicaron solos.

            **Revisá el diff contra los PDF oficiales y aprobá con Merge.**
            Al mergear, la pizarra se publica sola y las apps toman los
            valores nuevos al abrir con internet.
          branch: robot/parametros-fiscales
          delete-branch: true
