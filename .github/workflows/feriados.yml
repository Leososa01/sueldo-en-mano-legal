name: Feriados del año (automático)

# El calendario de feriados lo fija un decreto cada año, y a veces agrega días
# que ninguna regla calcula (el 09/11/2026, por la visita del Papa). El robot
# lee el calendario oficial de Jefatura de Gabinete y lo controla contra
# ArgentinaDatos (ver scripts/feriados.py). Cuando las dos fuentes coinciden
# publica solo, como el tope del SIPA: commit directo a main, sin PR.
# Cuando no coinciden, ese año no se toca y se abre un issue para que lo mire
# una persona. También abre un issue si el robot falla o si hay un feriado
# regional que no entiende: del 10/11 al 16/11/2026 estuvo en rojo todos los
# días sin que nadie se enterara (el correo de GitHub no se mira).
#
# Corre todos los días a las 09:30 de Argentina (media hora después del tope
# del SIPA, para no pisarse al hacer push). Los días sin novedades no hace nada.

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: pizarra-feriados
  cancel-in-progress: false

jobs:
  feriados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Leer el calendario oficial y controlarlo
        # El error queda en un archivo para que el issue de abajo lo cuente.
        run: python scripts/feriados.py 2> error-feriados.txt || { cat error-feriados.txt; exit 1; }

      - name: Publicar si cambió
        run: |
          if git diff --quiet -- parametros.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "robot-feriados"
          git config user.email "robot@sueldo-en-mano"
          VERSION=$(python -c "import json; print(json.load(open('parametros.json'))['version'])")
          git add parametros.json
          git commit -m "Pizarra v${VERSION}: feriados del calendario oficial (robot)"
          # El robot del tope del SIPA puede haber publicado en el medio.
          git pull --rebase
          git push

      - name: Avisar si las fuentes no coinciden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f desacuerdos-feriados.txt ]; then
            exit 0
          fi
          TITULO="Feriados: el calendario oficial y ArgentinaDatos no coinciden"
          if [ -n "$(gh issue list --state open --search "in:title \"$TITULO\"" --json number --jq '.[].number')" ]; then
            echo "Ya hay un issue abierto."
            exit 0
          fi
          {
            echo "El robot de feriados no publicó estos años porque las dos fuentes dicen cosas distintas:"
            echo
            sed 's/^/- /' desacuerdos-feriados.txt
            echo
            echo "Mirá el calendario oficial (argentina.gob.ar/jefatura/feriados-nacionales-AAAA) y el decreto."
            echo "Mientras tanto, la app sigue con lo que había publicado (o con su cálculo por la ley)."
          } > cuerpo.md
          gh issue create --title "$TITULO" --body-file cuerpo.md

      - name: Avisar si hay un feriado regional que no entiende
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f dudas-feriados.txt ]; then
            exit 0
          fi
          TITULO="Feriados: hay un feriado regional que el robot no entiende"
          if [ -n "$(gh issue list --state open --search "in:title \"$TITULO\"" --json number --jq '.[].number')" ]; then
            echo "Ya hay un issue abierto."
            exit 0
          fi
          {
            echo "El robot publicó los feriados nacionales y los puentes, pero dejó los regionales de ese año como estaban porque no entendió dónde rige alguno:"
            echo
            sed 's/^/- /' dudas-feriados.txt
            echo
            echo "Seguramente el calendario oficial cambió cómo escribe el lugar. Hay que enseñárselo a leer_especial() en scripts/feriados.py."
          } > cuerpo.md
          gh issue create --title "$TITULO" --body-file cuerpo.md

      - name: Avisar si el robot falló
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITULO="El robot de feriados falló"
          if [ -n "$(gh issue list --state open --search "in:title \"$TITULO\"" --json number --jq '.[].number')" ]; then
            echo "Ya hay un issue abierto: no se repite cada día."
            exit 0
          fi
          {
            echo "El robot de feriados terminó con error y no publicó nada (la pizarra quedó como estaba)."
            echo
            echo "Corrida: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            if [ -s error-feriados.txt ]; then
              echo '```'
              tail -n 20 error-feriados.txt
              echo '```'
            fi
            echo
            echo "Mientras siga así, la app no toma un decreto de feriados nuevo. Cerrá este issue cuando quede arreglado: si vuelve a fallar, se abre otro."
          } > cuerpo.md
          gh issue create --title "$TITULO" --body-file cuerpo.md
